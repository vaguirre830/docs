<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Potluck Sign-Up</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        p {
            color: #64748b;
            margin-top: 0;
        }

        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.5rem;
        }

        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        th {
            font-weight: 600;
            color: #475569;
            background-color: #f1f5f9;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 9999px;
            background-color: #e0e7ff;
            color: #3730a3;
        }

        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 2rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎉 Community Potluck</h1>
        <p>Add your dish below and see what everyone else is bringing!</p>
    </header>

    <!-- Sign-up Form Card -->
    <div class="card">
        <h3>Bring a Dish</h3>
        <form id="potluckForm">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" required placeholder="e.g., Alex Smith">
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" required>
                    <option value="" disabled selected>Select category...</option>
                    <option value="Appetizer">Appetizer / Starter</option>
                    <option value="Main">Main Dish</option>
                    <option value="Side">Side Dish / Salad</option>
                    <option value="Dessert">Dessert</option>
                    <option value="Drinks">Drinks</option>
                    <option value="Supplies">Utensils / Plates</option>
                </select>
            </div>
            <div class="form-group">
                <label for="dish">Item / Dish Description</label>
                <input type="text" id="dish" required placeholder="e.g., Garlic Mashed Potatoes">
            </div>
            <button type="submit" id="submitBtn">Sign Up</button>
        </form>
    </div>

    <!-- Live Results List Card -->
    <div class="card">
        <h3>Signed Up Items</h3>
        <div id="tableContainer">
            <table>
                <thead>
                    <tr>
                        <th>Who</th>
                        <th>Category</th>
                        <th>Bringing</th>
                    </tr>
                </thead>
                <tbody id="itemList">
                    <!-- Dynamic rows loaded here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // ⚠️ REPLACE THIS WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzjqog3g90AYnUAlTVYejXyxRGLeHk_oci_SbRa9WLlfAkGxxhzozvYJi8AOjNLu4c/exec";

    const form = document.getElementById('potluckForm');
    const submitBtn = document.getElementById('submitBtn');
    const tbody = document.getElementById('itemList');

    // 1. Fetch live data from Google Sheets
    async function renderTable() {
        tbody.innerHTML = `<tr><td colspan="3" class="empty-state">Loading responses...</td></tr>`;
        
        try {
            const response = await fetch(SCRIPT_URL);
            const items = await response.json();
            
            tbody.innerHTML = '';

            if (!items || items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="empty-state">No items claimed yet. Be the first!</td></tr>`;
                return;
            }

            items.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${escapeHtml(item.name)}</strong></td>
                    <td><span class="badge">${escapeHtml(item.category)}</span></td>
                    <td>${escapeHtml(item.dish)}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error("Error fetching data:", error);
            tbody.innerHTML = `<tr><td colspan="3" class="empty-state">Unable to load list. Check SCRIPT_URL configuration.</td></tr>`;
        }
    }

    // 2. Submit new entry to Google Sheets
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving...';

        const newItem = {
            name: document.getElementById('name').value.trim(),
            category: document.getElementById('category').value,
            dish: document.getElementById('dish').value.trim()
        };

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // Bypasses browser CORS restrictions for Apps Script
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newItem)
            });

            // Reset form and refresh table after submission
            this.reset();
            setTimeout(renderTable, 1200); // Brief delay for Sheet write latency
        } catch (error) {
            alert('Failed to submit item. Please try again.');
            console.error('Submission error:', error);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign Up';
        }
    });

    // Helper to prevent HTML injection
    function escapeHtml(str) {
        return (str || '').replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }

    // Load data on page load
    renderTable();
</script>

</body>
</html>
