<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Expense Tracker</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        p {
            color: #64748b;
            margin-top: 0;
        }

        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.5rem;
        }

        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        th {
            font-weight: 600;
            color: #475569;
            background-color: #f1f5f9;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 9999px;
            background-color: #e0e7ff;
            color: #3730a3;
        }

        .amount {
            font-weight: 600;
            color: #0f172a;
        }

        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 2rem;
        }

        .unauthorized-card {
            text-align: center;
            padding: 3rem 1.5rem;
            color: var(--danger);
        }

        .unauthorized-card h2 {
            margin-top: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Unauthorized Access State -->
    <div id="unauthorizedMessage" class="card unauthorized-card" style="display: none;">
        <h2>🔒 Access Denied</h2>
        <p style="color: #64748b;">No access.</p>
    </div>
    
    <!-- Main Content (Hidden until authorized) -->
    
    <div id="appContent" style="display: none;">
        <header>
            <h1>💳 Expense Tracker</h1>
            <p>Log shared expenses and view recent transactions.</p>
        </header>
        <!-- Expense Entry Form Card -->
        <div class="card">
            <h3>Add New Expense</h3>
            <form id="expenseForm">
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="" required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="" disabled selected>Select category...</option>
                        <option value="Groceries">Groceries</option>
                        <option value="Bills">Bills</option>
                        <option value="Restaurant">Restaurant</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Cars">Cars</option>
                        <option value="House">House</option>
                        <option value="Health">Health / Medical</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Hobbies">Hobbies</option>
                        <option value="Kids">Kids</option>
                        <option value="One-Time">One-Time</option>
                        <option value="Gifts">Gifts</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <button type="submit" id="submitBtn">Add Expense</button>
            </form>
        </div>

        <!-- Recent Expenses Table Card -->
        <div class="card">
            <h3>Latest 15 Expenses</h3>
            <div id="tableContainer">
                <table>
                    <thead>
                        <tr>
                            <th>Description</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Created</th>
                        </tr>
                    </thead>
                    <tbody id="itemList">
                        <!-- Dynamic rows loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // ⚠️ REPLACE THIS WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyEaTw-AzFJdi8sGnbbKt0hEaaUG2JqFFf5wN38pyixmqXa2i_tLoKTfxOQ30n-bY8/exec";

    // 1. Extract 'key' parameter from the current webpage URL
    const urlParams = new URLSearchParams(window.location.search);
    const API_KEY = urlParams.get('key');

    const form = document.getElementById('expenseForm');
    const submitBtn = document.getElementById('submitBtn');
    const tbody = document.getElementById('itemList');
    const appContent = document.getElementById('appContent');
    const unauthorizedMessage = document.getElementById('unauthorizedMessage');

    // Check key before showing UI
    if (!API_KEY) {
        unauthorizedMessage.style.display = 'block';
    } else {
        appContent.style.display = 'block';
        renderTable();
    }

    // Fetch live data from Google Sheets
    async function renderTable() {
        tbody.innerHTML = `<tr><td colspan="4" class="empty-state">Loading expenses...</td></tr>`;
        
        try {
            // Append key parameter to GET request
            const response = await fetch(`${SCRIPT_URL}?key=${encodeURIComponent(API_KEY)}`);
            const items = await response.json();
            
            if (items.error) {
                appContent.style.display = 'none';
                unauthorizedMessage.style.display = 'block';
                return;
            }

            tbody.innerHTML = '';

            if (!items || items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty-state">No expenses logged yet.</td></tr>`;
                return;
            }

            const recentItems = items.slice(-15).reverse();

            recentItems.forEach(item => {
                const tr = document.createElement('tr');
                
                const createdDate = item.created ? new Date(item.created).toLocaleString([], {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }) : 'N/A';

                const formattedAmount = item.amount ? `$${parseFloat(item.amount).toFixed(2)}` : '$0.00';

                tr.innerHTML = `
                    <td><strong>${escapeHtml(item.description)}</strong></td>
                    <td class="amount">${escapeHtml(formattedAmount)}</td>
                    <td><span class="badge">${escapeHtml(item.category)}</span></td>
                    <td>${escapeHtml(createdDate)}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error("Error fetching data:", error);
            tbody.innerHTML = `<tr><td colspan="4" class="empty-state">Unable to load list. Check SCRIPT_URL configuration.</td></tr>`;
        }
    }

    // Submit new expense entry to Google Sheets
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving...';

        const newItem = {
            key: API_KEY, // Pass secret key in POST body
            description: document.getElementById('description').value.trim(),
            amount: document.getElementById('amount').value,
            category: document.getElementById('category').value,
            //created: new Date().toISOString()
            created: new Date().toLocaleString().replace(/,/g, '');
        };

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newItem)
            });

            this.reset();
            setTimeout(renderTable, 1200);
        } catch (error) {
            alert('Failed to submit expense. Please try again.');
            console.error('Submission error:', error);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Add Expense';
        }
    });

    function escapeHtml(str) {
        return (str || '').toString().replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }
</script>

</body>
</html>
